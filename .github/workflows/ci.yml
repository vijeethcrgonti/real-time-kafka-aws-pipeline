name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ── Lint and Test ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml

  # ── Deploy Glue Job ────────────────────────────────────────────────────────
  deploy-glue:
    name: Deploy to AWS Glue
    runs-on: ubuntu-latest
    needs: test
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload Glue scripts to S3
        run: |
          aws s3 sync aws/ s3://${{ secrets.GLUE_SCRIPTS_BUCKET }}/scripts/ \
            --exclude "*" --include "*.py"
          aws s3 sync processing/ s3://${{ secrets.GLUE_SCRIPTS_BUCKET }}/scripts/processing/ \
            --exclude "*" --include "*.py"

      - name: Update Glue job
        run: |
          aws glue update-job \
            --job-name kafka-etl-pipeline \
            --job-update ScriptLocation=s3://${{ secrets.GLUE_SCRIPTS_BUCKET }}/scripts/glue_job.py
          echo "Glue job updated successfully"

      - name: Notify deployment
        run: echo "Deployed to AWS Glue — $(date -u)"
